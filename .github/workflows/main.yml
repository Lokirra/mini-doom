name: Construir APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Preparar carpeta www
        run: |
          if [ ! -f www/index.html ]; then
            SRC=$(find . -name index.html -not -path "./node_modules/*" -not -path "./android/*" | head -1)
            if [ -z "$SRC" ]; then echo "No se encontro index.html en el repositorio"; exit 1; fi
            echo "Encontrado: $SRC"
            D=$(dirname "$SRC")
            mkdir -p www
            for f in index.html manifest.webmanifest sw.js icon-192.png icon-512.png; do
              if [ -f "$D/$f" ] && [ "$D/$f" != "www/$f" ] && [ "./$D/$f" != "./www/$f" ]; then cp "$D/$f" www/; fi
            done
          fi
          ls www
      - run: npm install
      - run: npx cap add android
      - name: Pantalla completa real (sin franjas ni barras del sistema)
        run: |
          F=$(find android/app/src/main/java -name MainActivity.java | head -n 1)
          echo "Reemplazando $F"
          cat > "$F" <<'JAVA_EOF'
          package com.minidoom.game;

          import android.graphics.Color;
          import android.graphics.drawable.ColorDrawable;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;

          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  goFull();
                  try {
                      // una vez que la ventana ya existe, se repite (en Android 11+ antes de eso puede ignorarse)
                      getWindow().getDecorView().post(new Runnable() {
                          @Override
                          public void run() {
                              goFull();
                          }
                      });
                  } catch (Throwable t) {
                      // nada
                  }
              }

              @Override
              public void onResume() {
                  super.onResume();
                  goFull();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) goFull();
              }

              // Pantalla completa real: el juego se dibuja bajo la barra de estado, la barra de gestos y la zona de la camara.
              private void goFull() {
                  try {
                      Window w = getWindow();
                      WindowCompat.setDecorFitsSystemWindows(w, false);
                      if (Build.VERSION.SDK_INT >= 28) {
                          WindowManager.LayoutParams lp = w.getAttributes();
                          lp.layoutInDisplayCutoutMode = Build.VERSION.SDK_INT >= 30
                                  ? WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                                  : WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                          w.setAttributes(lp);
                      }
                      w.setBackgroundDrawable(new ColorDrawable(Color.BLACK));
                      w.setStatusBarColor(Color.TRANSPARENT);
                      w.setNavigationBarColor(Color.TRANSPARENT);
                      w.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                      View decor = w.getDecorView();
                      decor.setBackgroundColor(Color.BLACK);
                      WindowInsetsControllerCompat c = WindowCompat.getInsetsController(w, decor);
                      if (c != null) {
                          c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                          c.hide(WindowInsetsCompat.Type.systemBars());
                      }
                  } catch (Throwable t) {
                      // si algo no existe en este Android, el juego sigue funcionando igual
                  }
              }
          }
          JAVA_EOF
          grep -q goFull "$F"
          S=android/app/src/main/res/values/styles.xml
          sed -i 's#<style name="AppTheme.NoActionBar"[^>]*>#&\n        <item name="android:windowBackground">@android:color/black</item> <item name="android:statusBarColor">@android:color/black</item> <item name="android:navigationBarColor">@android:color/black</item> <item name="android:windowFullscreen">true</item> <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>#' "$S"
          grep -q windowLayoutInDisplayCutoutMode "$S"
          echo "--- styles.xml"; cat "$S"
          echo "--- OK: parche de pantalla completa aplicado"
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MiniDoom-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
