name: Construir APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Pantalla completa real (sin franjas ni barras del sistema)
        run: |
          F=$(find android/app/src/main/java -name MainActivity.java | head -n 1)
          echo "Reemplazando $F"
          cat > "$F" <<'JAVA_EOF'
          package com.minidoom.game;

          import android.graphics.Color;
          import android.graphics.drawable.ColorDrawable;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;

          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  goFull();
              }

              @Override
              public void onResume() {
                  super.onResume();
                  goFull();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) goFull();
              }

              // Pantalla completa real: el juego se dibuja bajo la barra de estado, la barra de gestos y la zona de la camara.
              private void goFull() {
                  try {
                      Window w = getWindow();
                      WindowCompat.setDecorFitsSystemWindows(w, false);
                      if (Build.VERSION.SDK_INT >= 28) {
                          WindowManager.LayoutParams lp = w.getAttributes();
                          lp.layoutInDisplayCutoutMode = Build.VERSION.SDK_INT >= 30
                                  ? WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                                  : WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                          w.setAttributes(lp);
                      }
                      w.setBackgroundDrawable(new ColorDrawable(Color.BLACK));
                      w.setStatusBarColor(Color.TRANSPARENT);
                      w.setNavigationBarColor(Color.TRANSPARENT);
                      w.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                      View decor = w.getDecorView();
                      decor.setBackgroundColor(Color.BLACK);
                      WindowInsetsControllerCompat c = WindowCompat.getInsetsController(w, decor);
                      if (c != null) {
                          c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                          c.hide(WindowInsetsCompat.Type.systemBars());
                      }
                  } catch (Throwable t) {
                      // si algo no existe en este Android, el juego sigue funcionando igual
                  }
              }
          }
          JAVA_EOF
          grep -q goFull "$F"
          S=android/app/src/main/res/values/styles.xml
          if [ -f "$S" ]; then sed -i 's#<style name="AppTheme.NoActionBar"[^>]*>#&\n        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>#' "$S"; fi
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MiniDoom-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
